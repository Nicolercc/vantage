name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The brief store's tests run against a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vantage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Match root package.json "packageManager" for reproducible installs.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated code is up to date
        run: pnpm run codegen && git diff --exit-code -- lib

      - name: Lint
        run: pnpm run lint

      - name: Typecheck and build
        run: pnpm run build
        env:
          CI: "true"

      - name: Test
        run: pnpm run test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vantage_test

  # The built site in a real browser, at a phone and a desktop size, with the
  # API mocked: accessibility (axe, WCAG 2.1 AA), no sideways scroll, 44px
  # touch targets, no text under 13px, shared left edges and console errors.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @workspace/vantage exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @workspace/vantage run e2e
        env:
          CI: "true"

      # Screenshots of every page at both sizes, the axe findings and, for a
      # failure, a trace to replay. Kept even when the tests pass.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: artifacts/vantage/playwright-report/
          retention-days: 14
